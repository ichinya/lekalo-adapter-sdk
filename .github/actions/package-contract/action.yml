name: Check a package using the public Lekalo CLI
description: Build a pinned host and execute the package-owned integration fixture
inputs:
  host:
    description: Full commit SHA of the host under test
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        repository: ichinya/lekalo
        ref: ${{ inputs.host }}
        path: .ci/host
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        package-manager-cache: false
    - uses: dtolnay/rust-toolchain@stable
    - name: Prepare bubblewrap on GitHub-hosted Linux
      if: runner.os == 'Linux' && runner.environment == 'github-hosted'
      id: confinement
      shell: bash
      run: |
        set -euo pipefail
        if [[ ! -x /usr/bin/bwrap ]]; then
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
        fi
        if ! /usr/bin/bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc /bin/true; then
          bash .ci/host/.github/ci/bwrap-apparmor.sh load
          echo 'loaded=true' >> "$GITHUB_OUTPUT"
        fi
    - name: Verify the Linux namespace backend
      if: runner.os == 'Linux'
      shell: bash
      run: /usr/bin/bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc /bin/true
    - name: Run the package contract
      shell: bash
      env:
        CARGO_INCREMENTAL: '0'
        CARGO_PROFILE_DEV_DEBUG: '0'
      run: |
        set -euo pipefail
        export CARGO_TARGET_DIR="$RUNNER_TEMP/lekalo-contract-host"
        cargo build --manifest-path .ci/host/Cargo.toml --locked -p lekalo-cli --bin lekalo
        export LEKALO_BIN="$CARGO_TARGET_DIR/debug/lekalo"
        if [[ -f test/portable-contract.json ]]; then
          node --test "$GITHUB_ACTION_PATH/../../../testing/portable-contract.mjs"
        else
          node --test test/host-contract.mjs
        fi
    - name: Remove the job's AppArmor policy
      if: always() && steps.confinement.outputs.loaded == 'true'
      shell: bash
      run: bash .ci/host/.github/ci/bwrap-apparmor.sh remove
