name: Host integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  compatibility:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: ichinya/lekalo-adapter-sdk/.github/actions/stage-host-tests@ebe6ce17bd948d52850fb1a600e07a1ddbee7062
        with:
          host: 9eb07ce8f21f96a9a160d382ac6280b9fa0fbcbe
      - name: Provision pinned external integration packages
        run: node scripts/external-tool.mjs --provision
      - name: Use physical temporary paths for synthetic project fixtures
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync, realpathSync} from 'node:fs';
          import {tmpdir} from 'node:os';
          // The native Windows resolver also expands 8.3 names.
          const root = realpathSync.native(tmpdir());
          for (const name of ['TEMP', 'TMP', 'TMPDIR']) {
            appendFileSync(process.env.GITHUB_ENV, `${name}=${root}\n`);
          }
          NODE
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the pinned host and its selected fixture services
        shell: bash
        run: |
          set -euo pipefail
          node scripts/external-tool.mjs --build-services
          cargo build --locked -p lekalo-cli --bins
          node -e 'const p=require("node:path"), fs=require("node:fs"), ext=process.platform==="win32"?".exe":""; for(const [k,n] of [["LEKALO_BIN","lekalo"],["LEKALO_DEBUG_BIN","lekalo"],["LEKALO_SDK_ORACLE","adapter-sdk-oracle"]]) fs.appendFileSync(process.env.GITHUB_ENV,k+"="+p.resolve("target/debug/"+n+ext)+"\n")'
      - name: Provision PHP 8.3 (issue #54, visible setup step, no project install)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # Composer is needed on every OS by the issue #56 fixture
          # provisioning step (the locked vendor tree is not committed).
          tools: composer
          # The locked Laravel runtime of the issue #56 fixture needs its
          # platform extensions; every dependency-free suite is unaffected.
          extensions: mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml, dom, xmlwriter, ctype, fileinfo, iconv, session
        id: php
      - name: Provision the pinned Go toolchain for the client-SDK gate (issue #72)
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.5"
          # The SDK gate creates its Go module in a disposable directory.
          # There is no repository-root dependency file to use as a cache key.
          cache: false
      - name: Provision exact Ajv 8.20.0 outside the checkout (issues #32, #48)
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/lekalo-ajv-8.20.0" --ignore-scripts --no-audit --no-fund --no-save ajv@8.20.0
          export NODE_PATH="$RUNNER_TEMP/lekalo-ajv-8.20.0/node_modules"
          test "$(node -p "require('ajv/package.json').version")" = "8.20.0"
      - name: Provision the Linux process confinement backend
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bubblewrap ripgrep
      - name: Load the CI-only AppArmor launcher prerequisite
        if: runner.os == 'Linux'
        id: apparmor
        timeout-minutes: 1
        run: |
          set -euo pipefail
          bash .github/ci/bwrap-apparmor.sh load
      - name: Verify the Linux namespace backend before adapter probes
        if: runner.os == 'Linux'
        run: /usr/bin/bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc /bin/true
      - name: Run the adapter-SDK vector parity gate (issue #106)
        # Four provisioned runtimes (Node ships with the runner, Go/PHP
        # are provisioned above, Rust by the toolchain step) replay the
        # shared corpus; a missing runtime is a failed setup, not a skip.
        # The lane also runs the real per-language lifecycle lanes, the
        # file-transport exchange, and the full-corpus production oracle
        # (issue #106 review r2 #8/#10).
        timeout-minutes: 15
        env:
          LEKALO_SDK_VECTOR_TRACE: "1"
        run: node scripts/test-adapter-sdk-vectors.mjs --language all
      - name: Run the adapter-SDK Go unit smoke (issue #106 review r2 #17)
        # The Go SDK ships its own smoke suite beside the vectors runner
        # so `go test ./...` exercises the runtime directly.
        run: go test ./...
        working-directory: tests/external/lekalo-adapter-sdk/sdk/go
      - name: Run the adapter-SDK conformance and package gates (issue #106)
        # The host binary was built above in this job, so the confined
        # strict battery, the feature-limited examples, and the packed
        # release-candidate verification run on every OS.
        timeout-minutes: 20
        run: |
          set -euo pipefail
          node scripts/test-adapter-sdk-conformance.mjs --language all --profile strict --repeats 3 --timeout-ms 60000
          node scripts/test-adapter-sdk-packages.mjs --verify
      - uses: ichinya/lekalo-adapter-sdk/.github/actions/expression-conformance@1053547d61d6d2a0ae2310a035ab9ab8d672930d
      - name: Remove the CI-only AppArmor launcher prerequisite
        if: always() && runner.os == 'Linux'
        timeout-minutes: 1
        run: |
          set -euo pipefail
          bash .github/ci/bwrap-apparmor.sh remove
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          if sudo grep -Eq '^lekalo-ci-bwrap(-child)? ' /sys/kernel/security/apparmor/profiles; then
            exit 1
          fi
