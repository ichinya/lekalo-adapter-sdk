name: Package CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - run: node scripts/check-protocol-inputs.mjs
      - run: node scripts/generate-adapter-sdk.mjs --check
      - run: node --test sdk/typescript/test/stream.mjs sdk/typescript/test/conformance.mjs
      - run: node sdk/typescript/test/vectors.mjs
      - run: node scripts/test-adapter-sdk-packages.mjs --verify --language typescript
      - name: Verify protocol schemas
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/lekalo-ajv" --no-save --ignore-scripts --no-audit --no-fund ajv@8.20.0
          node scripts/test-adapter-sdk-contracts.mjs
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path sdk/rust/Cargo.toml
      - run: cargo test --manifest-path sdk/expression-provider/Cargo.toml
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: sdk/go/go.mod
          cache: false
      - run: go test ./...
        working-directory: sdk/go
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: tokenizer
          tools: none
      - run: php sdk/php/test/vectors.php
